services:
  - type: web
    name: minacontrol-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: "off"
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: sh -c 'node src/migrate.js && exec node src/server.js'
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: minacontrol-db
          property: connectionString
      - key: WEB_ORIGIN
        sync: false
      - key: PORT
        value: "10000"
      - key: DEMO_DATA
        value: "true"

databases:
  - name: minacontrol-db
    plan: free
    region: oregon
    ipAllowList: []
