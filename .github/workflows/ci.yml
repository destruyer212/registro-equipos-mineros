name: Pruebas de MinaControl

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: API, Compose y rollback
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Instalar dependencias de la API
        run: npm ci --prefix backend --no-audit --no-fund
      - name: Probar reglas y validación
        run: node --test backend/test/equipment.unit.test.js
      - name: Preparar navegadores móviles
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps --only-shell chromium webkit
      - name: Probar PWA móvil, despliegue y rollback
        env:
          TEST_PWA_BROWSER: 'true'
        run: node --test tests/deploy.integration.test.mjs
